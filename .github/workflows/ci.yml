name: OrangeHRM PR CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================
  # JOB 1 - TYPECHECK
  # =========================
  typecheck:
    name: TypeScript Check

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck


  # =========================
  # JOB 2 - ALL TESTS
  # =========================
  playwright-tests:
    name: Playwright Tests

    needs: typecheck

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      BASE_URL: https://opensource-demo.orangehrmlive.com

      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      PW_HEADLESS: "true"
      PW_WORKERS: "1"
      PW_FULLY_PARALLEL: "false"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all tests
        run: npm test

      # Report tổng quan
      # PASS hoặc FAIL đều upload
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      # Evidence để debug
      # Chỉ cần khi test FAIL
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
